services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: agent_cs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d agent_cs"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/agent_cs
      NO_PAID_API: "true"
      EMBEDDING_BACKEND: "fake"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
