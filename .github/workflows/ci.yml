name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # 红线：CI 永远离线、零付费 API、不装 torch（FakeEmbedding）
  NO_PAID_API: "true"
  EMBEDDING_BACKEND: "fake"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps (no torch, no rag-local)
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy (strict)
        run: mypy app eval
      - name: Pytest (offline)
        run: pytest -q -m "not integration and not live" --cov=app --cov-report=term-missing
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-test-reports
          path: |
            .coverage
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: agent_cs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/agent_cs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Pytest (integration, real PostgreSQL + pgvector)
        run: pytest -q -m integration --cov=app --cov-report=term-missing
      - name: Ticket concurrency regressions (real PostgreSQL)
        run: >-
          pytest -q
          tests_stress/test_race_conditions.py::test_s1_concurrent_same_key_exactly_one_ticket
          tests_stress/test_race_conditions.py::test_s1b_concurrent_different_keys_create_unique_ticket_ids
          tests_stress/test_race_conditions.py::test_s2_concurrent_double_confirm_returns_controlled_idempotent_semantics
          tests_stress/test_race_conditions.py::test_s6a_concurrent_same_key_different_users_never_share_ticket
          tests_stress/test_race_conditions.py::test_s6b_concurrent_same_user_same_key_different_request_conflicts
          tests_stress/test_race_conditions.py::test_s7_concurrent_transition_only_one_wins
