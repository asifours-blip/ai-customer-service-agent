[project]
name = "ai-customer-service-agent"
version = "0.1.0"
description = "Agent + RAG 智能客服与工单自动化平台：受控 Agent、权限隔离、幂等工具、LLM 评测与 CI"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "langgraph>=0.2",
    "python-multipart>=0.0.9",  # 知识库上传（multipart/form-data）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
]
# 真实浏览器端到端测试（tests_e2e/，不进 CI 快速 job）；浏览器另需 `python -m playwright install chromium`
e2e = [
    "playwright>=1.45",
    "pytest-playwright>=0.5",
]
# 本地真实 embedding（BAAI/bge-small-zh-v1.5）；CI 不安装，CI 使用 FakeEmbedding
rag-local = [
    "sentence-transformers>=3.0",
    "torch>=2.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要 Docker PostgreSQL 的集成测试",
    "rag: RAG 管线测试（单测部分零依赖，管线部分依赖 integration 环境）",
    "tools: 工具层测试",
    "agent: Agent 工作流测试",
    "security: 安全测试（注入/IDOR）",
    "evaluation: 评测相关测试",
    "live: 调用真实付费 LLM API 的测试（默认不跑）",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008：FastAPI Depends() 位于默认参数是该框架的官方惯用法
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"eval/report.py" = ["E501"]  # 内嵌 HTML/CSS 模板行

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "sentence_transformers.*", "pgvector.*", "alembic.*", "uvicorn.*"]
ignore_missing_imports = true
